spring.application.name=productos

# Configuración del Servidor
# Cambiado a 8081 para que coincida con tu API Gateway
server.port=8082  

# Base de Datos Propia del Microservicio
spring.datasource.url=jdbc:postgresql://localhost:5432/cordillera_db_productos
spring.datasource.username=postgres
spring.datasource.password=admin123

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------
# Configuración del Circuit Breaker (Resilience4j)
# ---------------------------------------------------------
resilience4j.circuitbreaker.instances.categoriaCB.sliding-window-size=5
resilience4j.circuitbreaker.instances.categoriaCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.categoriaCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.categoriaCB.permitted-number-of-calls-in-half-open-state=2

# Permite que Hibernate cree las tablas antes de que se ejecute el data.sql
spring.jpa.defer-datasource-initialization=true

# Asegura que el script data.sql se ejecute siempre al iniciar
spring.sql.init.mode=never